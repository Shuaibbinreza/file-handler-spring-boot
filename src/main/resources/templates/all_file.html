<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Drive - File Storage</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
        }
        .drop-zone {
            border: 2px dashed #dee2e6;
            border-radius: 0.5rem;
            padding: 3rem;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            background: #fafafa;
        }
        .drop-zone:hover, .drop-zone.drag-over {
            border-color: #0d6efd;
            background: #e7f1ff;
        }
        .file-input {
            display: none;
        }
        .upload-progress-container {
            margin-top: 1.25rem;
            display: none;
        }
        .upload-progress-container.active {
            display: block;
        }
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.25rem;
        }
        .file-card {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 0.5rem;
            padding: 1.25rem;
            transition: all 0.3s ease;
        }
        .file-card:hover {
            box-shadow: 0 0.25rem 1rem rgba(0,0,0,0.1);
        }
        .file-icon {
            width: 3.5rem;
            height: 3.5rem;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        .file-icon.pdf { background: #ffebee; color: #d32f2f; }
        .file-icon.doc { background: #e3f2fd; color: #1976d2; }
        .file-icon.xls { background: #e8f5e9; color: #388e3c; }
        .file-icon.img { background: #f3e5f5; color: #7b1fa2; }
        .file-icon.video { background: #fff3e0; color: #f57c00; }
        .file-icon.audio { background: #e0f7fa; color: #00838f; }
        .file-icon.archive { background: #efebe9; color: #5d4037; }
        .file-icon.default { background: #f5f5f5; color: #757575; }
        .file-name {
            font-size: 0.875rem;
            font-weight: 500;
            color: #212529;
            margin-bottom: 0.5rem;
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .file-meta {
            font-size: 0.75rem;
            color: #6c757d;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
        }
        .toast {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <header class="bg-primary text-white py-3 px-4 d-flex align-items-center justify-content-between shadow">
        <div class="d-flex align-items-center gap-3">
            <span class="fs-4">📁</span>
            <h1 class="h4 mb-0">My Drive</h1>
        </div>
        <div class="bg-white bg-opacity-25 rounded px-3 py-2 d-flex align-items-center" style="width: 300px;">
            <span class="me-2">🔍</span>
            <input type="text" id="searchInput" class="bg-transparent border-0 text-white w-100" placeholder="Search files...">
        </div>
    </header>

    <div class="container py-4">
        <!-- Upload Section -->
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <div class="drop-zone" id="dropZone">
                    <div class="fs-1 mb-3">☁️</div>
                    <h5 class="text-dark mb-2">Drop files here to upload</h5>
                    <p class="text-muted mb-3">or click to browse from your computer</p>
                    <button class="btn btn-primary" id="selectFileBtn">Select File</button>
                    <input type="file" id="fileInput" class="file-input">
                </div>
                
                <div class="upload-progress-container" id="uploadProgress">
                    <div class="d-flex justify-content-between mb-2">
                        <span id="progressFileName">Uploading...</span>
                        <span class="text-primary fw-bold" id="progressPercent">0%</span>
                    </div>
                    <div class="progress mb-3" style="height: 8px;">
                        <div class="progress-bar bg-success" id="progressBar" role="progressbar" style="width: 0%"></div>
                    </div>
                    <div class="d-flex gap-2 justify-content-center">
                        <button class="btn btn-warning btn-sm" id="pauseBtn" title="Pause">⏸ Pause</button>
                        <button class="btn btn-success btn-sm" id="resumeBtn" title="Resume" style="display:none;">▶ Resume</button>
                        <button class="btn btn-danger btn-sm" id="cancelBtn" title="Cancel">✕ Cancel</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Files Section -->
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="mb-0">📂 My Files</h5>
                    <span class="text-muted" id="storageInfo">Loading...</span>
                </div>
                
                <div id="fileGrid" class="file-grid">
                    <div class="text-center py-4 text-muted">
                        <div class="spinner-border text-primary mb-3" role="status"></div>
                        <p>Loading files...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

<script>
$(document).ready(function() {
    const CHUNK_SIZE = 1024 * 1024; // 1MB chunks for large files
    let currentUploadId = null;
    let isPaused = false;
    let uploadCancelled = false;
    let currentFile = null;
    let lastUploadedChunk = 0;
    let isUploading = false;

    // Initialize
    loadFiles();

    // Pause button handler
    $('#pauseBtn').click(async function() {
        if (!currentUploadId || !isUploading) return;
        try {
            const response = await $.ajax({
                url: '/api/files/chunked/pause/' + currentUploadId,
                type: 'POST'
            });
            if (response.status === 'success') {
                isPaused = true;
                $('#pauseBtn').hide();
                $('#resumeBtn').show();
                showToast('Upload paused', 'info');
            }
        } catch (error) {
            console.log('Pause error (ignored):', error);
        }
    });

    // Resume button handler
    $('#resumeBtn').click(async function() {
        if (!currentUploadId || !isUploading) return;
        try {
            const response = await $.ajax({
                url: '/api/files/chunked/resume/' + currentUploadId,
                type: 'POST'
            });
            if (response.status === 'success') {
                isPaused = false;
                $('#resumeBtn').hide();
                $('#pauseBtn').show();
                showToast('Upload resumed', 'success');
                
                const progressResponse = await $.ajax({
                    url: '/api/files/chunked/progress/' + currentUploadId,
                    type: 'GET'
                });
                
                const progress = progressResponse.progress;
                const totalSize = currentFile.size;
                const uploadedBytes = (progress / 100) * totalSize;
                lastUploadedChunk = Math.ceil(uploadedBytes / CHUNK_SIZE);
                
                if (currentFile) {
                    uploadChunked(currentFile, lastUploadedChunk);
                }
            }
        } catch (error) {
            console.log('Resume error (trying to continue):', error);
            isPaused = false;
            $('#resumeBtn').hide();
            $('#pauseBtn').show();
            if (currentFile) {
                uploadChunked(currentFile, lastUploadedChunk);
            }
        }
    });

    // Cancel button handler
    $('#cancelBtn').click(async function() {
        if (!currentUploadId) return;
        if (!confirm('Are you sure you want to cancel this upload?')) return;
        try {
            uploadCancelled = true;
            isPaused = false;
            isUploading = false;
            await $.ajax({
                url: '/api/files/chunked/cancel/' + currentUploadId,
                type: 'POST'
            });
            hideProgress();
            showToast('Upload cancelled', 'info');
            currentUploadId = null;
            currentFile = null;
            lastUploadedChunk = 0;
        } catch (error) {
            showToast('Failed to cancel: ' + error.message, 'error');
        }
    });

    // Drag and Drop
    const dropZone = document.getElementById('dropZone');
    
    dropZone.addEventListener('dragover', function(e) {
        e.preventDefault();
        dropZone.classList.add('drag-over');
    });

    dropZone.addEventListener('dragleave', function() {
        dropZone.classList.remove('drag-over');
    });

    dropZone.addEventListener('drop', function(e) {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        
        const files = e.dataTransfer.files;
        if (files.length > 0) {
            handleFileUpload(files[0]);
        }
    });

    // File selection
    $('#selectFileBtn').click(function() {
        $('#fileInput').click();
    });

    $('#fileInput').change(function() {
        if (this.files.length > 0) {
            handleFileUpload(this.files[0]);
        }
    });

    // Search functionality
    $('#searchInput').on('input', function() {
        const searchTerm = $(this).val().toLowerCase();
        filterFiles(searchTerm);
    });

    function filterFiles(term) {
        $('.file-card').each(function() {
            const fileName = $(this).data('filename').toLowerCase();
            if (fileName.includes(term)) {
                $(this).show();
            } else {
                $(this).hide();
            }
        });
    }

    // File upload handler - supports both regular and chunked uploads
    function handleFileUpload(file) {
        const fileSize = file.size;
        const filename = file.name;
        
        // Reset state
        isPaused = false;
        uploadCancelled = false;
        lastUploadedChunk = 0;
        currentFile = file;
        isUploading = true;
        
        // Show progress bar
        $('#uploadProgress').addClass('active');
        $('#progressFileName').text(filename);
        $('#pauseBtn').show();
        $('#resumeBtn').hide();
        
        // For files larger than 5MB, use chunked upload
        if (fileSize > 5 * 1024 * 1024) {
            uploadChunked(file, 0);
        } else {
            uploadRegular(file);
        }
    }

    // Regular upload for smaller files
    function uploadRegular(file) {
        const formData = new FormData();
        formData.append('file', file);

        $.ajax({
            url: '/api/files/upload',
            type: 'POST',
            data: formData,
            contentType: false,
            processData: false,
            xhr: function() {
                const xhr = new window.XMLHttpRequest();
                xhr.upload.addEventListener('progress', function(e) {
                    if (e.lengthComputable) {
                        const percent = (e.loaded / e.total) * 100;
                        updateProgress(percent);
                    }
                });
                return xhr;
            },
            success: function(data) {
                isUploading = false;
                hideProgress();
                showToast('File uploaded successfully!', 'success');
                loadFiles();
                $('#fileInput').val('');
            },
            error: function(xhr) {
                isUploading = false;
                hideProgress();
                showToast('Upload failed: ' + (xhr.responseJSON?.message || 'Unknown error'), 'error');
            }
        });
    }

    // Chunked upload for large files
    async function uploadChunked(file, startChunk = 0) {
        try {
            // Initialize chunked upload only if starting from beginning
            if (startChunk === 0) {
                const initResponse = await $.ajax({
                    url: '/api/files/chunked/init',
                    type: 'POST',
                    data: {
                        filename: file.name,
                        totalSize: file.size,
                        contentType: file.type
                    }
                });

                currentUploadId = initResponse.uploadId;
            }
            
            // Upload chunks
            const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
            let chunkIndex = startChunk;
            let offset = startChunk * CHUNK_SIZE;

            while (offset < file.size) {
                // Check if cancelled
                if (uploadCancelled || !isUploading) {
                    return;
                }
                
                // Wait while paused
                while (isPaused && !uploadCancelled) {
                    await new Promise(resolve => setTimeout(resolve, 500));
                }
                
                if (uploadCancelled || !isUploading) {
                    return;
                }

                const chunk = file.slice(offset, offset + CHUNK_SIZE);
                const formData = new FormData();
                formData.append('uploadId', currentUploadId);
                formData.append('chunkIndex', chunkIndex);
                formData.append('chunk', chunk);

                await $.ajax({
                    url: '/api/files/chunked/upload',
                    type: 'POST',
                    data: formData,
                    contentType: false,
                    processData: false
                });

                offset += CHUNK_SIZE;
                chunkIndex++;
                lastUploadedChunk = chunkIndex;
                
                const progress = (offset / file.size) * 100;
                updateProgress(progress);
            }

            // Complete the upload
            const finalResponse = await $.ajax({
                url: '/api/files/chunked/complete',
                type: 'POST',
                data: { uploadId: currentUploadId }
            });

            // Reset state before showing success
            isPaused = false;
            uploadCancelled = false;
            isUploading = false;
            hideProgress();
            showToast('File uploaded successfully!', 'success');
            loadFiles();
            $('#fileInput').val('');
            currentUploadId = null;
            currentFile = null;
            lastUploadedChunk = 0;

        } catch (error) {
            // Only show error if actually cancelled or not uploading
            if (uploadCancelled || !isUploading) {
                return;
            }
            // Check if it's a network error or user aborted
            if (error.statusText === 'abort' || error.status === 0) {
                return;
            }
            hideProgress();
            isUploading = false;
            showToast('Upload failed: ' + (error.responseJSON?.message || error.message || 'Unknown error'), 'error');
        }
    }

    function updateProgress(percent) {
        $('#progressBar').width(percent + '%');
        $('#progressPercent').text(Math.round(percent) + '%');
    }

    function hideProgress() {
        $('#uploadProgress').removeClass('active');
        $('#progressBar').width('0%');
        $('#progressPercent').text('0%');
        $('#pauseBtn').hide();
        $('#resumeBtn').hide();
    }

    // Load files and render
    function loadFiles() {
        $.ajax({
            url: '/api/files',
            type: 'GET',
            success: function(files) {
                renderFiles(files);
                updateStorageInfo(files);
            },
            error: function() {
                $('#fileGrid').html(`
                    <div class="text-center py-4 text-danger">
                        <div class="fs-1 mb-2">⚠️</div>
                        <h5>Failed to load files</h5>
                        <p class="text-muted">Please refresh the page</p>
                    </div>
                `);
            }
        });
    }

    function renderFiles(files) {
        const grid = $('#fileGrid');
        
        if (!files || files.length === 0) {
            grid.html(`
                <div class="text-center py-4 text-muted">
                    <div class="fs-1 mb-2">📭</div>
                    <h5>No files yet</h5>
                    <p>Drop files here or click the upload button to get started</p>
                </div>
            `);
            return;
        }

        grid.empty();
        
        // Sort by upload date (newest first)
        files.sort((a, b) => new Date(b.uploadedAt) - new Date(a.uploadedAt));

        $.each(files, function(i, file) {
            const fileType = getFileType(file.contentType, file.originalName);
            const iconClass = getIconClass(fileType);
            const icon = getFileIcon(fileType);
            const formattedSize = formatFileSize(file.fileSize);
            const uploadDate = formatDate(file.uploadedAt);
            
            const card = $(`
                <div class="file-card" data-filename="${file.originalName}">
                    <div class="file-icon ${iconClass}">${icon}</div>
                    <div class="file-name" title="${file.originalName}">${file.originalName}</div>
                    <div class="file-meta">
                        <span>${formattedSize}</span>
                        <span>${uploadDate}</span>
                    </div>
                    <div class="d-flex gap-2">
                        <a href="/api/files/download/${file.id}" class="btn btn-primary btn-sm flex-grow-1">⬇ Download</a>
                        <button class="btn btn-outline-danger btn-sm" data-id="${file.id}">🗑 Delete</button>
                    </div>
                </div>
            `);
            
            grid.append(card);
        });

        // Attach delete handlers
        $('.btn-outline-danger').off('click').on('click', function(e) {
            e.preventDefault();
            const fileId = $(this).data('id');
            const fileName = $(this).closest('.file-card').find('.file-name').text();
            
            if (confirm('Are you sure you want to delete "' + fileName + '"?')) {
                deleteFile(fileId);
            }
        });
    }

    function deleteFile(fileId) {
        $.ajax({
            url: '/api/files/' + fileId,
            type: 'DELETE',
            success: function() {
                showToast('File deleted successfully', 'success');
                loadFiles();
            },
            error: function() {
                showToast('Failed to delete file', 'error');
            }
        });
    }

    function updateStorageInfo(files) {
        let totalSize = 0;
        $.each(files, function(i, file) {
            totalSize += file.fileSize || 0;
        });
        
        const formattedTotal = formatFileSize(totalSize);
        $('#storageInfo').text(`${files.length} files • ${formattedTotal} used`);
    }

    // Helper functions
    function getFileType(contentType, filename) {
        if (contentType) {
            if (contentType.includes('pdf')) return 'pdf';
            if (contentType.includes('word') || contentType.includes('document')) return 'doc';
            if (contentType.includes('sheet') || contentType.includes('excel') || contentType.includes('csv')) return 'xls';
            if (contentType.includes('image')) return 'img';
            if (contentType.includes('video')) return 'video';
            if (contentType.includes('audio')) return 'audio';
            if (contentType.includes('zip') || contentType.includes('rar') || contentType.includes('tar') || contentType.includes('compressed')) return 'archive';
        }
        
        // Fallback to extension
        const ext = filename.split('.').pop().toLowerCase();
        if (ext === 'pdf') return 'pdf';
        if (['doc', 'docx', 'odt', 'rtf'].includes(ext)) return 'doc';
        if (['xls', 'xlsx', 'csv', 'ods'].includes(ext)) return 'xls';
        if (['jpg', 'jpeg', 'png', 'gif', 'bmp', 'svg', 'webp'].includes(ext)) return 'img';
        if (['mp4', 'avi', 'mov', 'mkv', 'webm'].includes(ext)) return 'video';
        if (['mp3', 'wav', 'ogg', 'flac', 'aac'].includes(ext)) return 'audio';
        if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) return 'archive';
        
        return 'default';
    }

    function getIconClass(type) {
        return type;
    }

    function getFileIcon(type) {
        const icons = {
            'pdf': '📄',
            'doc': '📝',
            'xls': '📊',
            'img': '🖼️',
            'video': '🎬',
            'audio': '🎵',
            'archive': '📦',
            'default': '📁'
        };
        return icons[type] || '📁';
    }

    function formatFileSize(bytes) {
        if (!bytes || bytes === 0) return '0 B';
        
        const units = ['B', 'KB', 'MB', 'GB', 'TB'];
        let unitIndex = 0;
        let size = bytes;
        
        while (size >= 1024 && unitIndex < units.length - 1) {
            size /= 1024;
            unitIndex++;
        }
        
        return size.toFixed(2) + ' ' + units[unitIndex];
    }

    function formatDate(dateStr) {
        const date = new Date(dateStr);
        return date.toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'short',
            day: 'numeric'
        });
    }

    function showToast(message, type) {
        const toast = $('#toast');
        const bgClass = type === 'success' ? 'bg-success' : (type === 'error' ? 'bg-danger' : 'bg-warning text-dark');
        toast.removeClass('bg-success bg-danger bg-warning text-dark');
        toast.addClass(bgClass);
        toast.text(message).addClass('show');
        
        setTimeout(function() {
            toast.removeClass('show');
        }, 3000);
    }
});
</script>
</body>
</html>
